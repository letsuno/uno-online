services:
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\";
      else
        exec redis-server --appendonly yes --appendfsync everysec;
      fi"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./data/redis:/data

  server:
    image: djkcyl/uno-online-server:${UNO_IMAGE_TAG:-latest}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/uno.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a unique random value}
      DOMAIN: ${DOMAIN:-localhost}
      DEV_MODE: ${DEV_MODE:-false}
      ROOM_IDLE_TIMEOUT_MS: ${ROOM_IDLE_TIMEOUT_MS:-7200000}
      GITHUB_PROXY: ${GITHUB_PROXY:-}
      MUMBLE_ICE_ENABLED: ${MUMBLE_ICE_ENABLED:-true}
      MUMBLE_ICE_HOST: ${MUMBLE_ICE_HOST:-mumble}
      MUMBLE_ICE_PORT: ${MUMBLE_ICE_PORT:-6502}
      MUMBLE_ICE_SECRET: ${MUMBLE_ICE_SECRET:-uno-online-mumble-ice-secret}
      MUMBLE_ICE_SERVER_ID: ${MUMBLE_ICE_SERVER_ID:-1}
      MUMBLE_ICE_PARENT_CHANNEL_ID: ${MUMBLE_ICE_PARENT_CHANNEL_ID:-0}
      MUMBLE_CHANNEL_PREFIX: ${MUMBLE_CHANNEL_PREFIX:-UNO }
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      UNO_AI_PLUGINS_DIR: /ai/plugins
      UNO_AI_PLUGIN_SETTINGS_FILE: /ai/state/settings.json
      UNO_AI_DECISION_TIMEOUT_MS: ${UNO_AI_DECISION_TIMEOUT_MS:-1500}
      UNO_RL_ONNX_EP: ${UNO_RL_ONNX_EP:-cpu}
      PORT: '3001'
    volumes:
      - ./data/sqlite:/data
      - ${UNO_AI_PLUGINS_HOST_DIR:-./data/ai-plugins}:/ai/plugins:ro
      - ${UNO_AI_PLUGIN_STATE_HOST_DIR:-./data/ai-plugin-state}:/ai/state
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  caddy:
    image: djkcyl/uno-online-caddy:${UNO_IMAGE_TAG:-latest}
    depends_on:
      server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mumble:
    image: mumblevoip/mumble-server:latest
    ports:
      - '${MUMBLE_PORT:-64738}:64738/tcp'
      - '${MUMBLE_PORT:-64738}:64738/udp'
    volumes:
      - ./data/mumble:/data
    environment:
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPERUSER_PASSWORD:-admin}
      MUMBLE_CONFIG_ICE: ${MUMBLE_CONFIG_ICE:-tcp -h 0.0.0.0 -p 6502}
      MUMBLE_CONFIG_ICESECRETWRITE: ${MUMBLE_ICE_SECRET:-uno-online-mumble-ice-secret}
    restart: unless-stopped

  mumble-gateway:
    image: djkcyl/uno-online-mumble-gateway:latest
    volumes:
      - ./mumble-gateway.config.json:/app/config/config.json:ro
    depends_on:
      - mumble
    ports:
      - '${MUMBLE_GATEWAY_PORT:-64737}:64737'
    restart: unless-stopped
