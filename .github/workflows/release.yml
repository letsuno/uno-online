name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag commit belongs to main
        run: |
          git fetch origin main --no-tags
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: pnpm release:check "$GITHUB_REF_NAME"

      - name: Build all packages
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Preview MCP package
        run: pnpm --dir packages/mcp exec npm pack --dry-run

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate server image metadata
        id: server-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: djkcyl/uno-online-server
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Generate caddy image metadata
        id: caddy-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: djkcyl/uno-online-caddy
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server

      - name: Build and push caddy image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: caddy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.caddy-meta.outputs.tags }}
          labels: ${{ steps.caddy-meta.outputs.labels }}
          cache-from: type=gha,scope=release-caddy
          cache-to: type=gha,mode=max,scope=release-caddy

      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Publish MCP package
        working-directory: packages/mcp
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@uno-online/mcp@$version" version --json >/dev/null 2>&1; then
            echo "@uno-online/mcp@$version already exists; skipping npm publish."
          else
            npm publish --access public --provenance
          fi

      - name: Generate release notes
        run: pnpm release:notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "UNO Online $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "UNO Online $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "UNO Online $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
